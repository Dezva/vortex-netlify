[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# El index.html y los recursos se sirven desde la CDN de Netlify.
# Las rutas dinamicas se gestionan mediante config.path en vortex.mjs.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
